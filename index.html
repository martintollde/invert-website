  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #faf8f6;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .pl {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      background-size: 400% 400%;
      animation: plGradient 12s ease infinite;
    }
    @keyframes plGradient {
      0%, 100% { background: linear-gradient(135deg, #0a0a0a 0%, #050505 50%, #0a0a0a 100%); }
      50%      { background: linear-gradient(135deg, #050505 0%, #0a0a0a 50%, #111111 100%); }
    }
    .pl-content {
      text-align: center;
      max-width: 700px;
      padding: 2rem;
    }
    .pl-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 3rem;
      opacity: 0;
      animation: plFadeIn 1s ease forwards;
      animation-delay: 0.3s;
    }
    .pl-logo-icon { width: 28px; height: 28px; color: #EE2A2A; }
    .pl-logo-text {
      font-weight: 800;
      font-size: 1.4rem;
      color: #faf8f6;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }
    .pl-headline {
      font-weight: 800;
      font-size: clamp(2rem, 5vw, 3.6rem);
      line-height: 1.15;
      letter-spacing: -0.04em;
      color: #faf8f6;
      margin: 0;
      text-transform: uppercase;
    }
    .pl-word {
      display: inline-block;
      opacity: 0;
      transform: translateY(12px);
      animation: plWordIn 0.6s ease forwards;
    }
    .pl-word:nth-child(1) { animation-delay: 0.8s; }
    .pl-word:nth-child(2) { animation-delay: 0.95s; }
    .pl-word:nth-child(3) { animation-delay: 1.1s; }
    .pl-word:nth-child(4) { animation-delay: 1.25s; }
    .pl-word:nth-child(5) { animation-delay: 1.6s; }
    .pl-word:nth-child(6) { animation-delay: 1.75s; }
    .pl-word:nth-child(7) { animation-delay: 1.9s; }
    .pl-word:nth-child(8) { animation-delay: 2.05s; }
    .pl-accent { color: #EE2A2A; }
    @keyframes plFadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes plWordIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 600px) {
      .pl-headline { font-size: 1.8rem; }
      .pl-logo-text { font-size: 1.2rem; }
      .pl-content { padding: 1.5rem; }
    }
  </style>
</head>
<body>

</div>

</html>
